[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-engine"
version = "1.0.0.dev1"
description = "Independent deterministic verification for owner-enrolled software projects"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1.2,<2", "ruff>=0.11,<1"]
viewer = ["streamlit>=1.37,<2"]
security = ["pip-audit>=2.7,<3"]

[project.scripts]
qa = "qa_engine.cli:main"

[tool.setuptools.packages.find]
include = ["qa_engine*", "browser_worker"]

[tool.setuptools.package-data]
qa_engine = ["migrations/*.sql"]
browser_worker = ["*.ts", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: integration and acceptance verification", "acceptance: mandatory V1 acceptance scenario", "browser: executes the installed Chromium worker"]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["AI_QATesting_Agent", ".reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
